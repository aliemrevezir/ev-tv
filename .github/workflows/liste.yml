name: Kanal listesi

on:
  schedule:
    - cron: "0 0 * * *"   # 03:00 TSİ
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "liste/**"
      - ".github/workflows/liste.yml"

permissions:
  contents: write

concurrency:
  group: liste
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: liste/requirements.txt

      - run: pip install -r liste/requirements.txt

      - name: Testler
        run: python -m pytest -q liste

      - name: liste.json üret
        run: python liste/uret.py

      - name: Değiştiyse commit'le
        run: |
          if git diff --quiet -- liste.json && git ls-files --error-unmatch liste.json >/dev/null 2>&1; then
            echo "liste.json değişmedi"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liste.json liste/rapor.txt
          git commit -m "liste.json güncellendi"
          git pull --rebase origin main
          git push origin HEAD:main
